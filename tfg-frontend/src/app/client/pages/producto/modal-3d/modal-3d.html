<div
  class="fixed inset-0 bg-black/50 z-[300] flex items-center justify-center p-4"
  (click)="cerrar.emit()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Visor 3D de ' + (producto()?.nombre ?? 'producto')"
>
  <div
    class="bg-naan-grey rounded-2xl shadow-2xl flex flex-col overflow-hidden w-full max-w-2xl h-[80vh]"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 shrink-0">
      <p class="text-sm font-bold text-gray-900 m-0">Vista 3D · Talla {{ talla() }}</p>
      <button
        type="button"
        (click)="cerrar.emit()"
        class="w-8 h-8 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer text-base leading-none"
        aria-label="Cerrar visor 3D"
      >✕</button>
    </div>

    <div class="flex-1 min-h-0">
      <canvas
        #canvas3d
        class="w-full h-full block outline-none"
        aria-label="Visor 3D del modelo"
      ></canvas>
    </div>
  </div>
</div>
