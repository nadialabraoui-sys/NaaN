<!-- en escritorio -->
<div class="relative h-screen overflow-hidden max-md:hidden">

 <div
  class="landing-snap h-screen overflow-y-scroll [scroll-snap-type:y_mandatory] scroll-smooth [scrollbar-width:none]"
  #snapContainer
  role="main"
  (wheel)="onWheel($event)"
>

    <div class="[scroll-snap-align:start] [scroll-snap-stop:always] h-screen box-border flex flex-col">
      <div class="flex flex-col flex-1 overflow-hidden bg-white">

        <app-header-landing></app-header-landing>

        <div class="flex flex-1 flex-col items-end mr-50 justify-center px-20 pl-10 gap-4">
          <div class="text-naan-red text-[clamp(1.5rem,8vw,6rem)] font-bold whitespace-nowrap">
            <span aria-hidden="true">&#123; </span>
            <span class="inline-block skew-x-[-12deg]">NaaN</span>
            <span aria-hidden="true"> &#125;</span>
          </div>
          <div class="text-right font-bold italic [font-size:clamp(14px,1.5vw,22px)] text-[#1a1a1a] leading-relaxed" aria-label="Eslogan">
            <p class="m-0 [transform:skewX(-6deg)]">BY YOURSELF.</p>
            <p class="m-0 [transform:skewX(-6deg)]">BE YOURSELF.</p>
            <p class="m-0 [transform:skewX(-6deg)]">BUY IT YOURSELF.</p>
          </div>
        </div>

      </div>
    </div>

    <app-novedades></app-novedades>

  </div>

</div>

<!-- en movil-->
<div class="hidden max-md:block">

  <app-header [mostrarHamburguesa]="true" (hamburguesa)="navbarRef.toggle()"></app-header>

  <div class="min-h-[60vh] flex flex-col items-center justify-center px-6 gap-4">
    <div class="[font-size:clamp(48px,15vw,80px)] font-black text-naan-red leading-none text-center" aria-label="NaaN">
       <span aria-hidden="true">&#123; </span>
            <span class="inline-block skew-x-[-12deg]" aria-hidden=true>NaaN</span>
            <span aria-hidden="true"> &#125;</span>
    </div>
    <div class="text-center font-bold italic [font-size:clamp(14px,4vw,22px)] text-[#1a1a1a] leading-relaxed">
      <p class="m-0">BY YOURSELF.</p><p class="m-0">BE YOURSELF.</p><p class="m-0">BUY IT YOURSELF.</p>
    </div>
  </div>

  <app-novedades></app-novedades>

</div>

<app-navbar #navbarRef />

<nav
  class="fixed right-7 top-1/2 -translate-y-1/2 z-[100] flex flex-col items-center gap-2 max-md:hidden"
  aria-label="Navegación por secciones"
>
  <button
    class="bg-transparent border-none cursor-pointer text-[#aaa] text-base px-[6px] py-[2px] leading-none transition-colors duration-200 hover:text-naan-red disabled:opacity-25 disabled:cursor-default"
    (click)="anterior()"
    [disabled]="seccionActual() === 1"
    aria-label="Sección anterior"
  >&#8743;</button>
  @for (s of secciones; track s) {
    <button
      class="w-7 h-7 rounded-full border-[1.5px] border-[#ccc] text-[#999] text-[11px] font-bold cursor-pointer flex items-center justify-center transition-all duration-200 hover:border-naan-red hover:text-naan-red"
      [class.bg-naan-red]="s === seccionActual()"
      [class.border-naan-red]="s === seccionActual()"
      [class.text-white]="s === seccionActual()"
      (click)="irASeccion(s)"
      [attr.aria-label]="'Ir a sección ' + s"
      [attr.aria-current]="s === seccionActual() ? 'true' : null"
    >{{ s }}</button>
  }
  <button
    class="bg-transparent border-none cursor-pointer text-[#aaa] text-base px-[6px] py-[2px] leading-none transition-colors duration-200 hover:text-naan-red disabled:opacity-25 disabled:cursor-default"
    (click)="siguiente()"
    [disabled]="seccionActual() === secciones.length"
    aria-label="Sección siguiente"
  >&#8744;</button>
</nav>
